{% extends "base.html" %}
{% block title %}Play Wordle{% endblock %}
{% block content %}
<section class="game-panel">
  <h1>Wordle</h1>
  <p>Guess the five-letter word in <strong>5 guesses</strong>. You may start up to 3 games each day.</p>
  <div id="board" class="board" aria-label="Guess board"></div>
  <div class="guess-controls">
    <input id="guess-input" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" aria-label="Five-letter guess">
    <button id="submit-guess">Submit guess</button>
  </div>
  <button id="new-game">Start new game</button>
  <p id="status" role="status" aria-live="polite"></p>
</section>
<div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
  <div class="modal-card"><h2 id="result-title">Game finished</h2><p id="result-message"></p><button id="modal-ok">OK</button></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/game.js') }}" defer></script>{% endblock %}
